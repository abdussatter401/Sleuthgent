<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Local forensic viewer for Muse activity reconstructions">
  <title>Muse Activity Viewer</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">M</div>
        <div>
          <strong>Muse Activity</strong>
          <span>Forensic Viewer</span>
        </div>
      </div>
      <nav>
        <button class="nav-item active">
          <span class="nav-icon">≡</span><span>Sessions</span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <span class="privacy-dot"></span>
        <div><strong>Local analysis</strong><small>No evidence leaves this host</small></div>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <button id="menu-button" class="icon-button menu-button" aria-label="Toggle navigation">☰</button>
        <div>
          <p class="eyebrow">PROVIDER TRANSCRIPTS</p>
          <h1 id="view-title">Session investigation</h1>
        </div>
        <div class="topbar-meta">
          <span class="status-pill"><span></span>Evidence loaded</span>
          <button id="theme-button" class="icon-button" aria-label="Toggle contrast">◐</button>
        </div>
      </header>

      <div id="loading" class="loading-state" role="status">
        <div class="spinner"></div><span>Indexing reconstruction output…</span>
      </div>
      <div id="error-banner" class="error-banner hidden" role="alert"></div>

      <section id="sessions-view" class="view active" aria-labelledby="view-title">
        <div class="filter-bar">
          <label class="search-field"><span>⌕</span><input id="session-search" type="search" placeholder="Search prompts, tools, arguments, or session IDs"></label>
          <label><span>Android link</span><select id="session-run"><option value="">All sessions</option></select></label>
          <label><span>Approval</span><select id="session-approval"><option value="all">Any status</option><option value="any">Has approval</option><option value="approved">Approved</option><option value="declined">Declined</option><option value="none">No explicit approval</option></select></label>
          <label><span>Sort by</span><select id="session-sort"><option value="linked">Evidence link</option><option value="session_id">Session ID</option><option value="tool_calls">Tool calls</option><option value="turns">Turns</option><option value="approvals">Approvals</option></select></label>
        </div>
        <div class="session-layout">
          <article class="panel session-results">
            <div class="results-heading"><strong id="session-result-count">Sessions</strong><span id="session-page-label"></span></div>
            <div id="session-list" class="session-list"></div>
            <div id="session-pagination" class="pagination"></div>
          </article>
          <article id="session-detail" class="panel detail-panel">
            <div class="empty-state"><span>◎</span><h2>Select a session</h2><p>Review reconstructed turns, tool calls, approvals, and source locators.</p></div>
          </article>
        </div>
      </section>

    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js" defer></script>
</body>
</html>
